<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
@keyframes squish{0%,100%{transform:scale(1,1) translateY(0)}35%{transform:scale(1.06,.92) translateY(6px)}70%{transform:scale(.96,1.05) translateY(-4px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-7px) rotate(8deg)}}
@keyframes morph{0%,100%{d:path("M100 28 C150 24 172 66 168 104 C164 148 140 174 100 172 C60 174 34 146 32 104 C30 64 50 32 100 28 Z")}50%{d:path("M100 32 C146 26 176 60 170 100 C166 150 134 178 98 174 C58 176 30 150 30 102 C28 60 54 36 100 32 Z")}}
.body{animation:squish 3.2s ease-in-out infinite;transform-origin:100px 130px}
.blob{animation:morph 3.2s ease-in-out infinite}
.eye{animation:blink 4.1s infinite;transform-origin:center}
.bolt{animation:bob 2.6s ease-in-out infinite;transform-origin:150px 60px}
</style>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#ffb340"/><stop offset="1" stop-color="#f7931a"/>
</linearGradient>
<linearGradient id="p" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#d357ff"/><stop offset="1" stop-color="#9b2fd6"/>
</linearGradient>
</defs>
<g class="body">
<path class="blob" fill="url(#g)" d="M100 28 C150 24 172 66 168 104 C164 148 140 174 100 172 C60 174 34 146 32 104 C30 64 50 32 100 28 Z"/>
<ellipse cx="100" cy="160" rx="52" ry="8" fill="#000" opacity=".18"/>
<g class="eye"><circle cx="78" cy="92" r="9" fill="#1a1a1d"/><circle cx="81" cy="89" r="3" fill="#fff"/></g>
<g class="eye"><circle cx="122" cy="92" r="9" fill="#1a1a1d"/><circle cx="125" cy="89" r="3" fill="#fff"/></g>
<path d="M84 122 Q100 136 116 122" stroke="#1a1a1d" stroke-width="6" stroke-linecap="round" fill="none"/>
<text x="100" y="78" font-family="Arial Black,Arial" font-size="30" font-weight="900" text-anchor="middle" fill="#1a1a1d" opacity=".25">&#8383;</text>
</g>
<g class="bolt">
<path fill="url(#p)" d="M158 30 L138 66 L152 66 L134 96 L166 58 L152 58 L168 30 Z"/>
</g>
</svg>
