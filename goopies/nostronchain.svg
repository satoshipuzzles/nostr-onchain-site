<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
@keyframes swing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes clink{0%,80%,100%{transform:translateY(0)}88%{transform:translateY(3px)}}
.pair{animation:swing 3.8s ease-in-out infinite;transform-origin:100px 40px}
.eye{animation:blink 4.4s infinite;transform-origin:center}
.low{animation:clink 3.8s ease-in-out infinite}
</style>
<defs>
<linearGradient id="m" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#e8ecf2"/><stop offset="1" stop-color="#9aa3b2"/>
</linearGradient>
<linearGradient id="m2" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#ffc45e"/><stop offset="1" stop-color="#f7931a"/>
</linearGradient>
</defs>
<g class="pair">
<g>
<ellipse cx="82" cy="78" rx="34" ry="42" fill="none" stroke="url(#m)" stroke-width="14"/>
<g class="eye"><circle cx="72" cy="70" r="6" fill="#2c3440"/><circle cx="74" cy="68" r="2" fill="#fff"/></g>
<g class="eye"><circle cx="94" cy="70" r="6" fill="#2c3440"/><circle cx="96" cy="68" r="2" fill="#fff"/></g>
<path d="M74 90 Q83 97 92 90" stroke="#2c3440" stroke-width="4" stroke-linecap="round" fill="none"/>
</g>
<g class="low">
<ellipse cx="120" cy="128" rx="34" ry="42" fill="none" stroke="url(#m2)" stroke-width="14"/>
<g class="eye"><circle cx="110" cy="120" r="6" fill="#5c3600"/><circle cx="112" cy="118" r="2" fill="#fff"/></g>
<g class="eye"><circle cx="132" cy="120" r="6" fill="#5c3600"/><circle cx="134" cy="118" r="2" fill="#fff"/></g>
<path d="M112 140 Q121 147 130 140" stroke="#5c3600" stroke-width="4" stroke-linecap="round" fill="none"/>
</g>
</g>
</svg>
