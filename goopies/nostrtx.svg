<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
@keyframes roll{0%{transform:translateX(-14px) rotate(-12deg)}50%{transform:translateX(14px) rotate(12deg)}100%{transform:translateX(-14px) rotate(-12deg)}}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes coin1{0%,100%{transform:translateY(0);opacity:0}20%{opacity:1}60%{transform:translateY(-46px);opacity:0}}
@keyframes coin2{0%,100%{transform:translateY(0);opacity:0}35%{opacity:1}75%{transform:translateY(-38px);opacity:0}}
.ball{animation:roll 3.6s ease-in-out infinite;transform-origin:100px 120px}
.eye{animation:blink 4.3s infinite;transform-origin:center}
.c1{animation:coin1 3.6s ease-out infinite}
.c2{animation:coin2 3.6s ease-out infinite .6s}
</style>
<defs>
<radialGradient id="o" cx=".38" cy=".3" r="1">
<stop offset="0" stop-color="#ffc45e"/><stop offset=".7" stop-color="#f7931a"/><stop offset="1" stop-color="#d97908"/>
</radialGradient>
</defs>
<g class="c1"><circle cx="66" cy="70" r="10" fill="#ffc45e" stroke="#d97908" stroke-width="2"/><text x="66" y="75" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#8a5200">&#8383;</text></g>
<g class="c2"><circle cx="138" cy="66" r="8" fill="#ffc45e" stroke="#d97908" stroke-width="2"/><text x="138" y="70" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#8a5200">&#8383;</text></g>
<g class="ball">
<circle cx="100" cy="118" r="54" fill="url(#o)"/>
<ellipse cx="100" cy="176" rx="46" ry="7" fill="#000" opacity=".18"/>
<g class="eye"><circle cx="82" cy="106" r="8" fill="#5c3600"/><circle cx="84.5" cy="103.5" r="2.5" fill="#fff"/></g>
<g class="eye"><circle cx="118" cy="106" r="8" fill="#5c3600"/><circle cx="120.5" cy="103.5" r="2.5" fill="#fff"/></g>
<path d="M86 132 Q100 144 114 132" stroke="#5c3600" stroke-width="5" stroke-linecap="round" fill="none"/>
<text x="100" y="94" font-family="Arial Black,Arial" font-size="22" font-weight="900" text-anchor="middle" fill="#5c3600" opacity=".3">&#8383;</text>
</g>
</svg>
