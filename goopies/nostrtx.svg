<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
@keyframes roll{0%{transform:translateX(-14px) rotate(-12deg)}50%{transform:translateX(14px) rotate(12deg)}100%{transform:translateX(-14px) rotate(-12deg)}}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes coin1{0%,100%{transform:translateY(0);opacity:0}20%{opacity:1}60%{transform:translateY(-48px);opacity:0}}
@keyframes coin2{0%,100%{transform:translateY(0);opacity:0}35%{opacity:1}75%{transform:translateY(-40px);opacity:0}}
@keyframes spin{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
.ball{animation:roll 3.6s ease-in-out infinite;transform-origin:100px 120px}
.eye{animation:blink 4.3s infinite;transform-origin:center}
.c1{animation:coin1 3.6s ease-out infinite}
.c2{animation:coin2 3.6s ease-out infinite .6s}
</style>
<defs>
<radialGradient id="orb" cx=".34" cy=".24" r="1.15">
<stop offset="0" stop-color="#ffe0a3"/><stop offset=".35" stop-color="#ffb648"/>
<stop offset=".72" stop-color="#ef8c0f"/><stop offset="1" stop-color="#b56502"/>
</radialGradient>
<radialGradient id="ao3" cx=".5" cy=".95" r=".7">
<stop offset="0" stop-color="#6b3d00" stop-opacity=".5"/><stop offset="1" stop-color="#6b3d00" stop-opacity="0"/>
</radialGradient>
<linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffe1a0"/><stop offset=".5" stop-color="#ffc45e"/><stop offset="1" stop-color="#e09a2b"/>
</linearGradient>
<radialGradient id="gnd3" cx=".5" cy=".5" r=".5">
<stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
</radialGradient>
</defs>
<ellipse cx="100" cy="178" rx="52" ry="9" fill="url(#gnd3)"/>
<g class="c1">
<ellipse cx="66" cy="70" rx="11" ry="11" fill="url(#coin)" stroke="#b56502" stroke-width="2"/>
<ellipse cx="66" cy="70" rx="7.5" ry="7.5" fill="none" stroke="#b56502" stroke-width="1" opacity=".5"/>
<text x="66" y="75" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#7a4a00">&#8383;</text>
</g>
<g class="c2">
<ellipse cx="140" cy="64" rx="9" ry="9" fill="url(#coin)" stroke="#b56502" stroke-width="2"/>
<text x="140" y="68" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#7a4a00">&#8383;</text>
</g>
<g class="ball">
<circle cx="100" cy="118" r="54" fill="url(#orb)"/>
<circle cx="100" cy="118" r="54" fill="url(#ao3)"/>
<ellipse cx="78" cy="84" rx="22" ry="13" fill="#fff" opacity=".75" transform="rotate(-20 78 84)"/>
<ellipse cx="64" cy="100" rx="6" ry="3.5" fill="#fff" opacity=".4" transform="rotate(-24 64 100)"/>
<path d="M140 84 A54 54 0 0 1 152 130" stroke="#ffdf9e" stroke-width="4" stroke-linecap="round" fill="none" opacity=".5"/>
<g class="eye">
<ellipse cx="82" cy="108" rx="9" ry="10" fill="#4a2b00"/>
<circle cx="85" cy="104.5" r="3.2" fill="#fff"/>
<circle cx="79" cy="111" r="1.5" fill="#fff" opacity=".6"/>
</g>
<g class="eye">
<ellipse cx="118" cy="108" rx="9" ry="10" fill="#4a2b00"/>
<circle cx="121" cy="104.5" r="3.2" fill="#fff"/>
<circle cx="115" cy="111" r="1.5" fill="#fff" opacity=".6"/>
</g>
<path d="M86 132 Q100 146 114 132" stroke="#4a2b00" stroke-width="5.5" stroke-linecap="round" fill="none"/>
<ellipse cx="68" cy="124" rx="7" ry="4.5" fill="#ff6b4a" opacity=".35"/>
<ellipse cx="132" cy="124" rx="7" ry="4.5" fill="#ff6b4a" opacity=".35"/>
<text x="100" y="96" font-family="Arial Black,Arial" font-size="20" font-weight="900" text-anchor="middle" fill="#7a4a00" opacity=".35">&#8383;</text>
</g>
</svg>
