<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes wave{0%{stroke-dashoffset:60}100%{stroke-dashoffset:0}}
@keyframes ring{0%{r:8;opacity:.8}100%{r:28;opacity:0}}
.ghost{animation:floaty 3.4s ease-in-out infinite}
.eye{animation:blink 4s infinite;transform-origin:center}
.sig{stroke-dasharray:8 7;animation:wave 1.6s linear infinite}
.pulse{animation:ring 2.2s ease-out infinite}
.pulse2{animation:ring 2.2s ease-out infinite 1.1s}
</style>
