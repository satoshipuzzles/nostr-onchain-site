<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
@keyframes stretch{0%,100%{transform:scale(1,1)}50%{transform:scale(1.05,.94)}}
@keyframes blink{0%,89%,100%{transform:scaleY(1)}93%{transform:scaleY(.1)}}
@keyframes plug{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}
@keyframes spark{0%,45%,100%{opacity:0;transform:scale(.6)}55%,70%{opacity:1;transform:scale(1)}}
.jelly{animation:stretch 3s ease-in-out infinite;transform-origin:86px 130px}
.eye{animation:blink 4.6s infinite;transform-origin:center}
.cable{animation:plug 3s ease-in-out infinite}
.zap{animation:spark 3s infinite;transform-origin:150px 86px}
</style>
<defs>
<radialGradient id="vio" cx=".34" cy=".24" r="1.15">
<stop offset="0" stop-color="#eaaaff"/><stop offset=".4" stop-color="#c95cf7"/>
<stop offset=".78" stop-color="#9427d8"/><stop offset="1" stop-color="#5f0f96"/>
</radialGradient>
<radialGradient id="ao4" cx=".5" cy=".95" r=".7">
<stop offset="0" stop-color="#3a0561" stop-opacity=".55"/><stop offset="1" stop-color="#3a0561" stop-opacity="0"/>
</radialGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#9a9aa4"/><stop offset=".5" stop-color="#5c5c66"/><stop offset="1" stop-color="#333338"/>
</linearGradient>
<radialGradient id="gnd4" cx=".5" cy=".5" r=".5">
<stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
</radialGradient>
</defs>
<ellipse cx="90" cy="176" rx="54" ry="9" fill="url(#gnd4)"/>
<g class="jelly">
<path fill="url(#vio)" d="M86 42 C126 40 146 70 144 104 C142 142 122 166 86 164 C52 166 28 140 28 102 C28 66 48 44 86 42 Z"/>
<path fill="url(#ao4)" d="M86 42 C126 40 146 70 144 104 C142 142 122 166 86 164 C52 166 28 140 28 102 C28 66 48 44 86 42 Z"/>
<ellipse cx="62" cy="64" rx="20" ry="12" fill="#fff" opacity=".7" transform="rotate(-16 62 64)"/>
<ellipse cx="50" cy="80" rx="5" ry="3" fill="#fff" opacity=".4" transform="rotate(-20 50 80)"/>
<path d="M132 70 A56 56 0 0 1 142 108" stroke="#f0c8ff" stroke-width="3.5" stroke-linecap="round" fill="none" opacity=".45"/>
<path fill="#7d1bb5" d="M138 92 h20 v14 h-20 z"/>
<path fill="#9a3ad1" d="M138 92 h20 v4 h-20 z"/>
<g class="eye">
<ellipse cx="66" cy="94" rx="9" ry="10" fill="#28063f"/>
<circle cx="69" cy="90.5" r="3.2" fill="#fff"/>
<circle cx="63" cy="97" r="1.5" fill="#fff" opacity=".6"/>
</g>
<g class="eye">
<ellipse cx="104" cy="94" rx="9" ry="10" fill="#28063f"/>
<circle cx="107" cy="90.5" r="3.2" fill="#fff"/>
<circle cx="101" cy="97" r="1.5" fill="#fff" opacity=".6"/>
</g>
<path d="M70 122 Q86 136 102 122" stroke="#28063f" stroke-width="5.5" stroke-linecap="round" fill="none"/>
<ellipse cx="52" cy="112" rx="7" ry="4.5" fill="#ff7bd5" opacity=".4"/>
<ellipse cx="118" cy="112" rx="7" ry="4.5" fill="#ff7bd5" opacity=".4"/>
</g>
<g class="cable">
<rect x="158" y="88" width="22" height="22" rx="6" fill="url(#metal)"/>
<rect x="160" y="90" width="18" height="6" rx="3" fill="#fff" opacity=".25"/>
